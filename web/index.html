<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Story</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; padding: 15px; background: #fff; }
        input, textarea { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #0088cc; color: white; border: none; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <h2>📖 Request a Story</h2>
    <form id="requestForm">
        <label>Story Name:</label>
        <input type="text" id="storyName" required placeholder="Story Name...">
        
        <label>Details / Episode (Optional):</label>
        <textarea id="details" placeholder="Specify episode or details..."></textarea>
        
        <button type="submit" id="submitBtn">Submit Request</button>
    </form>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        document.getElementById('requestForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Submitting...";
            btn.disabled = true;

            const user = tg.initDataUnsafe.user || {};

            const payload = {
                story_name: document.getElementById('storyName').value,
                details: document.getElementById('details').value,
                user_id: user.id || "Unknown",
                first_name: user.first_name || "User",
                username: user.username || ""
            };

            try {
                // आपके Server Endpoint पर डेटा पोस्ट करना
                const response = await fetch('/api/request_story', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    tg.showAlert("✅ Your request has been submitted!");
                    tg.close();
                } else {
                    alert("Error submitting request. Try again.");
                    btn.disabled = false;
                    btn.innerText = "Submit Request";
                }
            } catch (err) {
                alert("Network error. Try again.");
                btn.disabled = false;
                btn.innerText = "Submit Request";
            }
        });
    </script>
</body>
</html>
