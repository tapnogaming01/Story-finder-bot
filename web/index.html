<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Story</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #17212b);
            color: var(--tg-theme-text-color, #ffffff);
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        h2 {
            text-align: center;
            color: var(--tg-theme-button-color, #64b5ef);
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #2b5278;
            border-radius: 8px;
            box-sizing: border-box;
            background-color: var(--tg-theme-secondary-bg-color, #242f3d);
            color: var(--tg-theme-text-color, #ffffff);
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--tg-theme-button-color, #64b5ef);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📖 Request a Story</h2>
    <form id="requestForm">
        <label>Story Name:</label>
        <input type="text" id="story_name" placeholder="Enter story name..." required>

        <label>Details / Episode (Optional):</label>
        <textarea id="story_details" rows="3" placeholder="Specify episode or details..."></textarea>

        <button type="submit">Submit Request</button>
    </form>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    document.getElementById('requestForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const data = {
            story_name: document.getElementById('story_name').value,
            details: document.getElementById('story_details').value
        };

        tg.sendData(JSON.stringify(data));
        tg.close();
    });
</script>

</body>
</html>
