<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Request Story</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--tg-theme-bg-color, #0f172a);
            color: var(--tg-theme-text-color, #f8fafc);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: var(--tg-theme-secondary-bg-color, #1e293b);
            width: 100%;
            max-width: 400px;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Nav Tabs */
        .tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.2);
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--tg-theme-hint-color, #94a3b8);
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: var(--tg-theme-button-color, #0284c7);
            color: #ffffff;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header-icon {
            font-size: 40px;
            margin-bottom: 6px;
            display: inline-block;
        }

        .header h2 {
            font-size: 18px;
            font-weight: 700;
            color: var(--tg-theme-text-color, #fff);
        }

        .header p {
            font-size: 12px;
            color: var(--tg-theme-hint-color, #94a3b8);
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--tg-theme-text-color, #e2e8f0);
        }

        input, textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            background: var(--tg-theme-bg-color, #0f172a);
            color: var(--tg-theme-text-color, #fff);
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus {
            border-color: var(--tg-theme-button-color, #38bdf8);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        textarea {
            resize: none;
            height: 80px;
        }

        .submit-btn, .close-btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .submit-btn {
            background: var(--tg-theme-button-color, #0284c7);
            color: var(--tg-theme-button-text-color, #ffffff);
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
        }

        .close-btn {
            background: #ef4444;
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(239, 68, 68, 0.3);
            margin-top: 15px;
        }

        .submit-btn:active, .close-btn:active {
            transform: scale(0.98);
        }

        /* Request List Items */
        .req-list {
            max-height: 250px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .req-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .req-title {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }

        .req-status {
            font-size: 12px;
            margin-top: 4px;
            display: inline-block;
            padding: 2px 8px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
        }

        .hidden {
            display: none !important;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid #ffffff;
            border-bottom-color: transparent;
            border-radius: 50%;
            display: inline-block;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <!-- Tab Navigation -->
        <div class="tabs">
            <button class="tab-btn active" id="newReqTab">📝 New Request</button>
            <button class="tab-btn" id="myReqTab">📊 My Requests</button>
        </div>

        <!-- 1. Form Section -->
        <div id="formSection">
            <div class="header">
                <span class="header-icon">📖</span>
                <h2>Request a Story</h2>
                <p>Fill details below to request your content</p>
            </div>

            <form id="requestForm">
                <div class="form-group">
                    <label for="storyName">Story Name <span style="color: #ef4444;">*</span></label>
                    <input type="text" id="storyName" placeholder="Enter story title..." required autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="details">Episode / Details (Optional)</label>
                    <textarea id="details" placeholder="Specify episode numbers or author..."></textarea>
                </div>

                <button type="submit" id="submitBtn" class="submit-btn">
                    <span id="btnText">Submit Request</span>
                </button>
            </form>
        </div>

        <!-- 2. My Requests Section (Feature 1) -->
        <div id="myReqSection" class="hidden">
            <div class="header">
                <span class="header-icon">📋</span>
                <h2>Your Requests</h2>
                <p>Live status of your requested content</p>
            </div>
            <div class="req-list" id="requestsContainer">
                <p style="text-align: center; font-size: 12px; color: #94a3b8;">Loading requests...</p>
            </div>
        </div>
    </div>

    <!-- 3. Success Screen -->
    <div class="card hidden" id="successCard">
        <div class="header" style="text-align: center;">
            <span style="font-size: 50px;">🎉</span>
            <h2 style="margin-top: 10px;">Request Submitted!</h2>
            <p style="margin-top: 8px; font-size: 13px; color: #cbd5e1;">
                आपकी स्टोरी की रिक्वेस्ट भेज दी गई है। अपलोड होते ही बॉट आपको सूचित कर देगा।
            </p>
        </div>

        <button type="button" id="closeBtn" class="close-btn">
            ✖️ Close Window
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe.user || {};

        const newReqTab = document.getElementById('newReqTab');
        const myReqTab = document.getElementById('myReqTab');
        const formSection = document.getElementById('formSection');
        const myReqSection = document.getElementById('myReqSection');
        const requestForm = document.getElementById('requestForm');
        const mainCard = document.getElementById('mainCard');
        const successCard = document.getElementById('successCard');

        // Tab Switching Logic
        newReqTab.addEventListener('click', () => {
            newReqTab.classList.add('active');
            myReqTab.classList.remove('active');
            formSection.classList.remove('hidden');
            myReqSection.classList.add('hidden');
        });

        myReqTab.addEventListener('click', () => {
            myReqTab.classList.add('active');
            newReqTab.classList.remove('active');
            formSection.classList.add('hidden');
            myReqSection.classList.remove('hidden');
            fetchUserRequests();
        });

        // Submit Form
        requestForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            
            submitBtn.disabled = true;
            btnText.innerHTML = `<span class="spinner"></span> Submitting...`;

            const payload = {
                story_name: document.getElementById('storyName').value.trim(),
                details: document.getElementById('details').value.trim() || "N/A",
                user_id: user.id || "Unknown",
                first_name: user.first_name || "User",
                username: user.username ? `@${user.username}` : "None"
            };

            try {
                const response = await fetch('/api/request_story', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    mainCard.classList.add('hidden');
                    successCard.classList.remove('hidden');
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                } else {
                    tg.showAlert("❌ Server error! Please try again.");
                    resetBtn();
                }
            } catch (err) {
                tg.showAlert("⚠️ Network error!");
                resetBtn();
            }
        });

        // Fetch Requests History
        async function fetchUserRequests() {
            const container = document.getElementById('requestsContainer');
            if (!user.id) {
                container.innerHTML = `<p style="text-align: center; color: #ef4444; font-size: 12px;">User data unavailable!</p>`;
                return;
            }

            try {
                const res = await fetch(`/api/my_requests?user_id=${user.id}`);
                const data = await res.json();

                if (data.status === "success" && data.requests.length > 0) {
                    container.innerHTML = data.requests.map(req => `
                        <div class="req-item">
                            <div class="req-title">📖 ${req.story_name}</div>
                            <div class="req-status">Status: <b>${req.status}</b></div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = `<p style="text-align: center; color: #94a3b8; font-size: 12px;">No requests found yet!</p>`;
                }
            } catch (e) {
                container.innerHTML = `<p style="text-align: center; color: #ef4444; font-size: 12px;">Error loading data!</p>`;
            }
        }

        document.getElementById('closeBtn').addEventListener('click', () => tg.close());

        function resetBtn() {
            const submitBtn = document.getElementById('submitBtn');
            document.getElementById('btnText').innerText = "Submit Request";
            submitBtn.disabled = false;
        }
    </script>
</body>
</html>
